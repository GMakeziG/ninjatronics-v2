<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" width="32" height="32">
  <!-- PROPOSED favicon (tuned for 32–64px, per ninjatronics-logo-reference5.png):
       the mark on a dark rounded Ink Black tile so it holds on light and dark
       browser tabs. Flat fills, no texture, no glow. Thicker enso and a bolder
       prompt so it stays legible. -->
