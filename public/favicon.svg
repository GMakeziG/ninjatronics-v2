    <g id="b">
      <path d="M0,-126 Q-13,-58 -30,-30 L0,0 Z" fill="#d9dde0"/>
      <path d="M0,-126 Q13,-58 30,-30 L0,0 Z" fill="#7d848a"/>
    </g>
  </defs>
  <rect x="-128" y="-128" width="256" height="256" rx="56" fill="#101214"/>
  <g transform="scale(0.84)">
    <circle r="86" fill="none" stroke="#e15a3b" stroke-width="22"/>
    <use href="#b" transform="rotate(45)"/>
    <use href="#b" transform="rotate(135)"/>
    <use href="#b" transform="rotate(225)"/>
    <use href="#b" transform="rotate(315)"/>
    <circle r="46" fill="#0c0e10" stroke="#b7bdc2" stroke-width="5"/>
    <g fill="none" stroke="#2fd3c6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24,-15 L-7,0 L-24,15"/>
      <path d="M2,16 L25,16"/>
