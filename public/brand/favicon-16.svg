<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" width="16" height="16">
  <!-- PROPOSED 16px favicon per ninjatronics-logo-reference5.png: dark rounded
       Ink Black tile, simplified star silhouette and enso. The prompt is
       reduced to a single teal chevron because ">_" can't resolve at 16px.
       No glow. -->
