<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" width="256" height="256" role="img" aria-label="Ninjatronics">
  <!-- PROPOSED compact variant for the site header (rendered ~40px).
       Same geometry as shuriken-mark.svg; the fine dry-brush trails are removed
       because they don't hold at small sizes. The prompt glow is kept but softened.
       Blade edges: a #4f565c outline so the light tips hold on Warm Paper. -->
  <defs>
    <linearGradient id="bladeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#9aa1a7"/>
    </linearGradient>
    <linearGradient id="bladeDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d848a"/>
      <stop offset="1" stop-color="#363c41"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3d7db"/>
      <stop offset="1" stop-color="#4f565c"/>
    </linearGradient>
    <filter id="promptGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="blade">
      <path d="M0,-122 Q-17,-62 -31.11,-31.11 L0,0 Z" fill="url(#bladeLight)"/>
      <path d="M0,-122 Q17,-62 31.11,-31.11 L0,0 Z" fill="url(#bladeDark)"/>
      <path d="M0,-122 Q-17,-62 -31.11,-31.11 L0,0 L31.11,-31.11 Q17,-62 0,-122 Z" fill="none" stroke="#4f565c" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <circle r="88" fill="none" stroke="#e15a3b" stroke-width="17" stroke-linecap="round" stroke-dasharray="520 33" transform="rotate(-62)"/>

  <use href="#blade" transform="rotate(45)"/>
  <use href="#blade" transform="rotate(135)"/>
  <use href="#blade" transform="rotate(225)"/>
  <use href="#blade" transform="rotate(315)"/>

  <circle r="42" fill="#0c0e10" stroke="url(#rim)" stroke-width="5"/>

  <g fill="none" stroke="#2fd3c6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#promptGlow)">
    <path d="M-21,-13 L-6,0 L-21,13"/>
    <path d="M1,14 L22,14"/>
  </g>
</svg>
