# Pull-request checks for Ninjatronics v2. Read-only: no secrets, no deploys.
# Deployment is done by Cloudflare Workers Builds, not by this workflow.
#
# Actions are pinned to full commit SHAs (tags can be moved); the comment
# beside each SHA records the release it corresponds to.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npm run check

      - name: Importer tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate Worker configuration (no upload)
        run: npm run deploy:check
